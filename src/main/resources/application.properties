spring.application.name=simplycraft
server.port=8080

# Server directories: servers/<id>/server.jar, mods/, world/, ...
simplycraft.servers-path=./servers
simplycraft.backups-path=./backups
# Java used to start the servers (can be overridden per server)
simplycraft.java-path=java
simplycraft.default-xms=1G
simplycraft.default-xmx=4G
# Lines per server kept in memory for the console (Minecraft writes logs/latest.log itself)
simplycraft.console-backlog=2000
simplycraft.stop-timeout=60s
# Set a token as soon as the console is reachable by anyone else: starting servers runs arbitrary jars
simplycraft.api-token=
simplycraft.custom-command-enabled=true
# Other frontends of the ecosystem that may call the API, e.g. http://localhost:8081
simplycraft.cors-allowed-origins=

# Backups are pushed to Simplyfile (POST /file/upload); empty disables the integration
simplycraft.simplyfile.url=
simplycraft.simplyfile.token=

simplycraft.modrinth.api-url=https://api.modrinth.com/v2
simplycraft.modrinth.user-agent=titustesche/simplycraft/1.0
simplycraft.sources.mojang-manifest=https://piston-meta.mojang.com/mc/game/version_manifest_v2.json
simplycraft.sources.fabric-meta=https://meta.fabricmc.net/v2

spring.servlet.multipart.max-file-size=20GB
spring.servlet.multipart.max-request-size=20GB
# Console streams stay open
spring.mvc.async.request-timeout=-1
